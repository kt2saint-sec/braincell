[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braincell-mcp"
version = "0.2.0"
description = "Local-first persistent-memory MCP server. Per-project brain with hybrid vector + FTS5 search, recall, remember, forget, and supersede over a single SQLite file."
readme = "README.md"
requires-python = ">=3.11"
# Dual-licensed: AGPL-3.0-or-later (LICENSE) + a separate commercial license
# (COMMERCIAL-LICENSE.md) for proprietary/closed-source use.
license = { file = "LICENSE" }
authors = [{ name = "Karl Toussaint", email = "kt2saint.create@gmail.com" }]
keywords = ["mcp", "memory", "embeddings", "sqlite", "claude", "rag"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

# Every eagerly-imported package is declared here so a clean
# `pip install braincell-mcp` runs out-of-box: gui.py imports fastapi/anyio
# unconditionally and `braincell-map` is an unconditional console script, so
# fastapi/uvicorn are BASE deps, not an extra (mcp[cli] does NOT pull them in —
# verified). httpx (embed.py) and pydantic are likewise imported directly, so
# they are declared first-party rather than relied on transitively via mcp.
# Upper bounds cap the major version so a breaking release can't be pulled in
# silently. NOT a substitute for a hash-pinned lockfile — generate one with
# `uv lock` / `uv pip compile --generate-hashes` and run osv-scanner in CI.
dependencies = [
    "mcp[cli]>=1.12.0,<2",
    "numpy>=1.26.0,<3",
    "aiosqlite>=0.20.0,<1",
    "rich>=13.7.0,<15",
    "ollama>=0.2.0,<1",        # default embed provider (local-first)
    "python-ulid>=2.2.0,<4",   # project-id minting (build path)
    "fastapi>=0.115,<1",       # GUI (gui.py imports it unconditionally)
    "uvicorn>=0.30,<1",        # GUI server
    "httpx>=0.28.0,<1",        # embed.py HTTP client
    "anyio>=4.14.0,<5",        # gui.py async plumbing
    "pydantic>=2.13.0,<3",     # request/response models
]

[project.optional-dependencies]
openai = ["openai>=1.40.0,<3"]   # hosted embed provider (text-embedding-3-*)
# Native desktop window (braincell start --native): PySide6/QtWebEngine fronts
# the SAME localhost FastAPI server — no SPA changes, browser access unchanged.
# Optional on purpose: ~0.5 GB of Qt wheels is wrong to force on headless/MCP-only
# installs. Supply-chain gate cleared 2026-07-25: The Qt Company's official
# PyPI package (Qt for Python team), 56 releases over years, wheels-only,
# latest 6.11.1 uploaded 2026-05-13 (well past the 3-7 day cooldown).
native = ["PySide6>=6.8,<7"]
# Back-compat alias: fastapi/uvicorn moved into base dependencies (gui.py needs
# them unconditionally), so `pip install braincell-mcp[gui]` stays valid but
# adds nothing.
gui = []
dev = ["pytest>=8.0.0,<9", "ruff>=0.6.0,<1"]

[project.scripts]
braincell-mcp = "braincell.server:main"
braincell = "braincell.cli:main"
braincell-map = "braincell.cli:main_map"

[project.urls]
Homepage = "https://github.com/kt2saint-sec/braincell-mcp"

[tool.setuptools]
packages = ["braincell"]

[tool.setuptools.package-data]
braincell = [
    "py.typed",
    "assets/*.svg", "assets/*.png", "assets/*.ico",
    # Claude Code skills shipped for `braincell install --skills`. Glob is
    # per-skill-dir so a new skill needs no pyproject change.
    "skills/*/SKILL.md",
]

[tool.ruff]
# Eval FIXTURE repos are deliberately imperfect sample code that a task asks an
# agent to improve — e.g. throttle-body/repo/sync_client.py carries an unused
# `time` import because the expected fix is a retry/backoff. Linting them would
# invite "cleanups" that silently change what the eval measures.
extend-exclude = ["evals/task-ab/tasks/*/repo"]

[tool.pytest.ini_options]
# Starlette 1.3+ TestClient prefers the Pydantic-maintained `httpx2`; with plain
# `httpx` installed it emits a one-shot StarletteDeprecationWarning at import.
# It rides in only via fastapi.testclient.TestClient (GUI/federation tests) — no
# braincell runtime code touches it. We do NOT adopt httpx2 yet (supply-chain
# cooldown: released 2026-07-23, unvetted), so silence the noise here instead.
# Remove this filter if/when httpx2 is vetted and adopted as a test dependency.
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
