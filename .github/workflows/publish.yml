name: Publish package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]' build twine
      - run: ruff check braincell tests
      - run: pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/inspect_release_artifacts.py dist
      - uses: pypa/gh-action-pypi-publish@release/v1
