name: Publish package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]' build twine
      - name: Ruff fatal correctness rules
        run: ruff check --select E9,F63,F7,F82 braincell tests
      - run: pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/inspect_release_artifacts.py dist
      - name: Clean wheel and sdist install smoke
        run: |
          python -m venv /tmp/braincell-wheel
          /tmp/braincell-wheel/bin/pip install --force-reinstall dist/*.whl
          /tmp/braincell-wheel/bin/braincell --help
          /tmp/braincell-wheel/bin/braincell-mcp --help
          /tmp/braincell-wheel/bin/braincell-map --help
          /tmp/braincell-wheel/bin/braincell setup --help
          python -m venv /tmp/braincell-sdist
          /tmp/braincell-sdist/bin/pip install --force-reinstall dist/*.tar.gz
          /tmp/braincell-sdist/bin/braincell --help
          /tmp/braincell-sdist/bin/braincell-mcp --help
          /tmp/braincell-sdist/bin/braincell-map --help
          /tmp/braincell-sdist/bin/braincell setup --help
      - uses: pypa/gh-action-pypi-publish@release/v1
