name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: ruff check braincell tests
      - run: pytest -q
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/inspect_release_artifacts.py dist
      - run: |
          python -m venv /tmp/braincell-wheel
          /tmp/braincell-wheel/bin/pip install dist/*.whl
          /tmp/braincell-wheel/bin/braincell --help
          /tmp/braincell-wheel/bin/braincell-mcp --help
          /tmp/braincell-wheel/bin/braincell-map --help
          /tmp/braincell-wheel/bin/braincell setup --help
