name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev,gui]'
      - name: Ruff fatal correctness rules
        run: ruff check --select E9,F63,F7,F82 braincell tests
      - name: Ruff changed Python files
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          LINT_BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/lint_changed_python.py --base "origin/${LINT_BASE_REF}"
      - name: Qt runtime system libraries (Linux)
        # The native Memory Map is mandatory product surface; the suite's real
        # QtWebEngine import probe needs the system libraries Qt links against.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0 libnss3 \
            libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libgbm1 libxkbfile1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1
      - run: pytest -q
        # A hang must fail fast with output, not idle for the 6-hour job limit
        # (observed: a Windows console-wide CTRL_C_EVENT wedged pytest for 6 h).
        timeout-minutes: 30
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/inspect_release_artifacts.py dist
      - name: Smoke test built wheel
        shell: bash
        run: |
          # RUNNER_TEMP, not /tmp: on Windows the (native) python resolves /tmp
          # to C:\tmp while Git-Bash maps it to the MSYS mount — two different
          # directories. Backslashes are normalized so bash and python agree.
          VENV="${RUNNER_TEMP//\\//}/braincell-wheel"
          python -m venv "$VENV"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="$VENV/Scripts"
          else
            BIN="$VENV/bin"
          fi
          "$BIN/pip" install dist/*.whl
          "$BIN/braincell" --help
          "$BIN/braincell-mcp" --help
          "$BIN/braincell-map" --help
          "$BIN/braincell" setup --help

  lint-debt-report:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install '.[dev,gui]'
      - name: Full-tree Ruff technical-debt report
        run: ruff check braincell tests --statistics --exit-zero
