name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - name: Ruff fatal correctness rules
        run: ruff check --select E9,F63,F7,F82 braincell tests
      - name: Ruff changed Python files
        env:
          LINT_BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/lint_changed_python.py --base "origin/${LINT_BASE_REF}"
      - run: pytest -q
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/inspect_release_artifacts.py dist
      - run: |
          python -m venv /tmp/braincell-wheel
          /tmp/braincell-wheel/bin/pip install dist/*.whl
          /tmp/braincell-wheel/bin/braincell --help
          /tmp/braincell-wheel/bin/braincell-mcp --help
          /tmp/braincell-wheel/bin/braincell-map --help
          /tmp/braincell-wheel/bin/braincell setup --help

  lint-debt-report:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - name: Full-tree Ruff technical-debt report
        run: ruff check braincell tests --statistics
